# Fly.io app config for booking-core (Phase 1 Go/Fiber service). Generated by hand to match this
# repo's Dockerfile rather than `fly launch`'s auto-detected one — app name below is a placeholder,
# change it before first deploy (Fly app names are globally unique). See DEPLOYMENT.md for the
# full setup walkthrough.
app = "massageshop-booking-core"
primary_region = "sin" # Singapore — closest Fly region to Thailand

[build]

[env]
PORT = "8081"
# DATABASE_URL is a secret, not an env var here — set with:
#   fly secrets set DATABASE_URL="postgresql://..."

[http_service]
internal_port = 8081
force_https = true
auto_stop_machines = true
auto_start_machines = true
# Scales to zero when idle to keep cost near-zero on low traffic; the tradeoff is a cold start
# (roughly a second) on the first request after idle. Set to 1 instead if that cold start ever
# causes a customer-visible delay on /book-now.
min_machines_running = 0

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/healthz"

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
